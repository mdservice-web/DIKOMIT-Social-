<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10121d"><title>DIKOMIT Social</title>
<style>
:root{color-scheme:dark;--bg:#0c0e18;--panel:#151827;--muted:#9ba2b8;--a:#a78bfa;--b:#62d7c4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#282344,transparent 32%),var(--bg);color:#f4f5fb;font:15px/1.5 system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:20px}.panel,.card{background:var(--panel);border:1px solid #ffffff18;border-radius:18px;padding:20px;margin:12px 0}.hidden{display:none!important}.field{display:block;width:100%;padding:12px;margin:7px 0 13px;border-radius:10px;border:1px solid #ffffff25;background:#0e1120;color:white}.btn{padding:11px 15px;border:0;border-radius:10px;background:linear-gradient(110deg,var(--a),var(--b));color:#111322;font-weight:800;cursor:pointer}.soft{padding:10px 14px;border:1px solid #ffffff25;border-radius:10px;background:#1b2032;color:white;cursor:pointer}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.photo{width:100%;height:210px;object-fit:cover;border-radius:12px;background:#222}.muted,small{color:var(--muted)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:clamp(28px,5vw,42px)}button:disabled{opacity:.6;cursor:wait}#notice{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#252b40;padding:12px 18px;border-radius:12px;max-width:90%;z-index:10}
</style></head><body><main class="wrap">
<section id="auth" class="panel"><h1>DIKOMIT Social</h1><p class="muted" id="authInfo">Create your account to join the community.</p><form id="authForm"><div id="usernameBox"><label>Username</label><input class="field" id="username" minlength="3" maxlength="24" required></div><label>Email</label><input class="field" id="email" type="email" autocomplete="email" required><label>Password</label><input class="field" id="password" type="password" minlength="6" autocomplete="current-password" required><button class="btn" id="submitAuth">Create account</button></form><button class="soft" id="switchAuth">Already registered? Log in</button></section>
<section id="app" class="hidden"><header><h2>DIKOMIT / Social</h2><div><button class="soft" id="searchBtn">Search V-ID</button> <button class="soft" id="logoutBtn">Log out</button></div></header><h1>Welcome, <span id="welcome"></span> ✨</h1><p class="muted" id="myVid"></p><nav class="nav"><button class="soft" data-page="home">Home</button><button class="soft" data-page="following">Following</button><button class="soft" data-page="upload">Upload</button><button class="soft" data-page="profile">Profile</button></nav><div id="content" class="panel">Loading…</div></section>
</main><div id="notice" class="hidden"></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut,updateProfile} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,collection,addDoc,getDocs,query,where,orderBy,limit,serverTimestamp,runTransaction,deleteDoc} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyDZUWXm7DJU0KW12LlLdvUTiA7AKl3tias',authDomain:'dikomit-social.firebaseapp.com',projectId:'dikomit-social',storageBucket:'dikomit-social.firebasestorage.app',messagingSenderId:'304803290541',appId:'1:304803290541:web:6e314ef850a0d02d595524',measurementId:'G-4KGS834X6F'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let isLogin=false,user=null,profile=null,page='home';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function note(t){$('#notice').textContent=t;$('#notice').classList.remove('hidden');setTimeout(()=>$('#notice').classList.add('hidden'),3500)}function err(e){const m={'auth/email-already-in-use':'Email already registered. Log in instead.','auth/invalid-credential':'Email or password is incorrect.','auth/weak-password':'Password must be at least 6 characters.','permission-denied':'Firestore Security Rules blocked this action.'};return m[e.code]||e.message||'Something went wrong.'}
async function makeProfile(u,name){const username=name.trim().replace(/\s+/g,'_');if(!/^[a-zA-Z0-9_.]{3,24}$/.test(username))throw Error('Username: 3–24 letters, numbers, dots or underscores.');const vId='V-'+u.uid.slice(0,8).toUpperCase();await runTransaction(db,async tx=>{const ur=doc(db,'users',u.uid),vr=doc(db,'vIds',vId),us=await tx.get(ur),vs=await tx.get(vr);if(us.exists())return;if(vs.exists())throw Error('V-ID collision. Please retry signup.');tx.set(vr,{uid:u.uid,createdAt:serverTimestamp()});tx.set(ur,{uid:u.uid,username,vId,bio:'',photoURL:'',createdAt:serverTimestamp()})});return (await getDoc(doc(db,'users',u.uid))).data()}
$('#switchAuth').onclick=()=>{isLogin=!isLogin;$('#usernameBox').classList.toggle('hidden',isLogin);$('#authInfo').textContent=isLogin?'Log in to your DIKOMIT account.':'Create your account to join the community.';$('#submitAuth').textContent=isLogin?'Log in':'Create account';$('#switchAuth').textContent=isLogin?'New here? Create account':'Already registered? Log in'};
$('#authForm').onsubmit=async e=>{e.preventDefault();const b=$('#submitAuth');b.disabled=true;try{const email=$('#email').value.trim(),password=$('#password').value;if(isLogin){await signInWithEmailAndPassword(auth,email,password)}else{const cred=await createUserWithEmailAndPassword(auth,email,password);try{await updateProfile(cred.user,{displayName:$('#username').value.trim()});await makeProfile(cred.user,$('#username').value)}catch(x){await signOut(auth);throw x}}}catch(x){note(err(x))}finally{b.disabled=false}};
onAuthStateChanged(auth,async u=>{user=u;if(!u){profile=null;$('#app').classList.add('hidden');$('#auth').classList.remove('hidden');return}try{const s=await getDoc(doc(db,'users',u.uid));if(!s.exists())throw Error('Profile document not found.');profile=s.data();$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');$('#welcome').textContent=profile.username;$('#myVid').textContent=profile.vId;await render()}catch(x){note(err(x));}});
async function followingIds(){const s=await getDocs(collection(db,'users',user.uid,'following'));return s.docs.map(d=>d.id)}
function postHtml(d){const p=d.data;return `<article class="card"><img class="photo" src="${esc(p.imageURL)}" alt="Post photo" loading="lazy"><b>${esc(p.username)}</b> <small>${esc(p.vId)}</small><p>${esc(p.caption)}</p><button class="soft like" data-id="${d.id}">Like</button> <button class="soft comment" data-id="${d.id}">Comment</button></article>`}
async function render(){const c=$('#content');c.textContent='Loading…';try{if(page==='home'||page==='following'){let ids=null;if(page==='following')ids=await followingIds();let qy=query(collection(db,'posts'),orderBy('createdAt','desc'),limit(40));let s=await getDocs(qy),rows=s.docs.map(x=>({id:x.id,data:x.data()}));if(ids)rows=rows.filter(x=>ids.includes(x.data.uid));c.innerHTML=`<h2>${page==='home'?'Community feed':'Following feed'}</h2><div class="grid">${rows.length?rows.map(postHtml).join(''):'<p class="muted">No posts to show yet.</p>'}</div>`;bindPost()}else if(page==='upload'){c.innerHTML=`<h2>Create a post</h2><form id="postForm"><label>Image URL (temporary until Backblaze is connected)</label><input class="field" id="imageURL" type="url" placeholder="https://…" required><label>Caption</label><input class="field" id="caption" maxlength="180"><button class="btn">Publish post</button></form><p class="muted">This saves the image URL in Firestore; it does not upload image files.</p>`;$('#postForm').onsubmit=async e=>{e.preventDefault();try{await addDoc(collection(db,'posts'),{uid:user.uid,username:profile.username,vId:profile.vId,imageURL:$('#imageURL').value.trim(),caption:$('#caption').value.trim(),createdAt:serverTimestamp()});note('Post published online');page='home';render()}catch(x){note(err(x))}}}else{const s=await getDocs(query(collection(db,'posts'),where('uid','==',user.uid),orderBy('createdAt','desc'),limit(40)));c.innerHTML=`<h2>${esc(profile.username)}</h2><p>${esc(profile.vId)}</p><div class="grid">${s.docs.length?s.docs.map(x=>postHtml({id:x.id,data:x.data()})).join(''):'<p class="muted">No posts yet.</p>'}</div>`;}}catch(x){c.textContent='Could not load: '+err(x)}}
function bindPost(){document.querySelectorAll('.like').forEach(b=>b.onclick=async()=>{try{const r=doc(db,'posts',b.dataset.id,'likes',user.uid),s=await getDoc(r);if(s.exists()){await deleteDoc(r);b.textContent='Like'}else{await setDoc(r,{uid:user.uid,createdAt:serverTimestamp()});b.textContent='Liked'} }catch(x){note(err(x))}});document.querySelectorAll('.comment').forEach(b=>b.onclick=()=>note('Comments UI will be added in the next integration step.'))}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$('#logoutBtn').onclick=()=>signOut(auth);
$('#searchBtn').onclick=async()=>{const v=prompt('Enter exact V-ID (example V-12345678)');if(!v)return;try{const s=await getDoc(doc(db,'vIds',v.trim().toUpperCase()));if(!s.exists()){note('No profile found');return}const target=s.data().uid;if(target===user.uid){note('That is your own V-ID');return}await setDoc(doc(db,'users',user.uid,'following',target),{uid:target,createdAt:serverTimestamp()});note('Following list updated')}catch(x){note(err(x))}};
</script></body></html>
